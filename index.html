<style>
:root{--bg:#0c0d12;--s1:rgba(255,255,255,.045);--s2:rgba(255,255,255,.08);--line:rgba(255,255,255,.09);--line2:rgba(230,200,143,.34);
--text:#f4efe6;--mute:#9b98a6;--gold:#e6c88f;--gold2:#b88d4f;--ink:#2a1d0a;--win:#57c99b;--lose:#e5707a;--wine:#b0364a;
--ui:"Onest",-apple-system,"Segoe UI",Roboto,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;--size:120px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--text);font-family:var(--ui);min-height:100vh;display:flex;justify-content:center;background:var(--bg);-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(70% 45% at 12% -5%,rgba(120,36,62,.42),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(16,70,82,.38),transparent 70%)}
.app{position:relative;width:100%;max-width:440px;padding:calc(14px + env(safe-area-inset-top)) 16px calc(188px + env(safe-area-inset-bottom))}
body[data-view="profile"] .app{padding-bottom:calc(30px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer;color:inherit;transition:transform .12s,background .2s,border-color .2s,opacity .2s}
button:active{transform:scale(.98)}
input{font-family:inherit}
svg.ic{width:1em;height:1em;flex:none}
.busy .lockable{opacity:.5;pointer-events:none}
.view{display:none}.view.on{display:block;animation:viewIn .25s ease both}
@keyframes viewIn{from{opacity:0}to{opacity:1}}
@keyframes pop{50%{transform:scale(1.06)}}
.dbal.pop{animation:pop .4s}

.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avbtn{border:0;background:transparent;padding:0;flex:none}
.avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-family:var(--serif);font-weight:700;font-size:24px;color:var(--gold);background:#17181f;border:1px solid var(--line2);box-shadow:0 0 0 3px rgba(230,200,143,.08)}
.avatar img{width:100%;height:100%;object-fit:cover}
.wallet{flex:1;min-width:0}
.wallet small{display:block;font-size:12px;font-weight:500;color:var(--mute);margin-bottom:1px}
.wallet div{display:flex;align-items:center;gap:7px;font-family:var(--serif);font-weight:700;font-size:32px;line-height:1}
.wallet .ic{font-size:21px}
.plus{border:1px solid var(--line2);background:var(--s1);color:var(--gold);border-radius:14px;padding:11px 15px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.plus .ic{font-size:13px}

.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;padding:4px;margin-bottom:14px;background:var(--s1);border:1px solid var(--line);border-radius:18px}
.seg button{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px 2px;border:1px solid transparent;border-radius:14px;background:transparent;color:var(--mute);font-weight:600;font-size:14px}
.seg button .ic{font-size:16px}
.seg button.on{color:var(--gold);background:rgba(230,200,143,.1);border-color:var(--line2)}
.testbar{margin:0 0 12px;padding:7px 12px;border-radius:12px;border:1px dashed var(--line2);color:var(--gold);font-size:12px;text-align:center;line-height:1.4}
.strip{display:flex;gap:6px;justify-content:center;min-height:30px;margin-bottom:10px;overflow:hidden}.strip:empty{display:none}
.strip b{padding:5px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.strip b.w{background:rgba(230,200,143,.16);color:var(--gold);border:1px solid var(--line2)}.strip b.l{background:var(--s1);color:var(--mute);border:1px solid var(--line)}

.stage{position:relative;overflow:hidden;border-radius:28px;margin-bottom:14px;padding:24px 12px 16px;text-align:center;border:1px solid var(--line);
 background:radial-gradient(80% 55% at 50% 0%,rgba(230,200,143,.13),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));box-shadow:0 30px 60px -34px #000,inset 0 1px 0 rgba(255,255,255,.07)}
.result{display:inline-block;min-height:34px;margin-top:12px;padding:7px 18px;border-radius:999px;font-size:14px;font-weight:600;background:var(--s1);border:1px solid var(--line);color:var(--mute)}
.result.win{color:var(--win);background:rgba(87,201,155,.12);border-color:rgba(87,201,155,.4)}
.result.lose{color:var(--lose);background:rgba(229,112,122,.1);border-color:rgba(229,112,122,.35)}

.cta{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:16px;font-size:16px;font-weight:800;color:var(--ink);background:linear-gradient(180deg,#f2dcaa,#c9a064);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 12px 28px -10px rgba(230,200,143,.5)}
.cta:disabled{opacity:.45}.cta .ic{font-size:17px}
.ghost{width:100%;margin-top:10px;border:1px solid var(--line2);background:transparent;border-radius:14px;padding:14px;font-size:15px;font-weight:600;color:var(--text)}

.card,.mulcard{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:13px 15px}
.mulcard{display:flex;align-items:center;justify-content:space-between;gap:14px}
.cap{color:var(--mute);font-size:13px;font-weight:500;margin-bottom:4px}
.field{display:flex;align-items:center;gap:4px}
.field .x{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--gold)}
.field input{width:96px;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font-family:var(--serif);font-size:32px;font-weight:700;padding:0}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.mulside{text-align:right;min-width:0}
.info{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute);margin-top:4px}
.mulside .info{justify-content:flex-end;margin:0 0 4px}.info b{color:var(--text);font-weight:700}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:1 0 auto;min-width:54px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;color:var(--mute)}
.chips button.sel{color:var(--gold);background:rgba(230,200,143,.1);border-color:var(--line2)}
.hint{color:var(--mute);font-size:13px;text-align:center;margin-top:14px;line-height:1.45}

.wheel-wrap{position:relative;width:310px;height:310px;margin:4px auto 2px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.5))}
.ring{position:absolute;inset:-4px;border-radius:50%;z-index:1;pointer-events:none;background:conic-gradient(from 30deg,#f6e4b8,#a67b3f,#f6e4b8,#a67b3f,#f6e4b8);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px));mask:radial-gradient(farthest-side,transparent calc(100% - 13px),#000 calc(100% - 12px))}
#leds{display:none}
.wheelbox{position:absolute;inset:11px;border-radius:50%;overflow:hidden;background:#101117}
.wheelbox canvas{width:100%;height:100%;display:block;transition:transform 2.7s cubic-bezier(.1,.62,.08,1);will-change:transform}
.pin{position:absolute;top:-14px;left:50%;width:34px;height:44px;margin-left:-17px;z-index:5;transform-origin:50% 14px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5))}
.pin svg{width:100%;height:100%}
.spinning .pin{animation:pinTick .16s infinite alternate}
@keyframes pinTick{from{transform:rotate(-7deg)}to{transform:rotate(5deg)}}
.hub{position:absolute;top:50%;left:50%;width:66px;height:66px;margin:-33px 0 0 -33px;border-radius:50%;z-index:4;display:grid;place-items:center;font-size:27px;background:radial-gradient(#23242d,#0e0f14);border:2px solid var(--gold)}

.ugauge{position:relative;width:280px;height:280px;margin:0 auto}
.ugauge svg.ring2{position:absolute;inset:0;width:100%;height:100%}
.upcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.upct{font-family:var(--serif);font-weight:700;font-size:58px;line-height:.95}
.upct.hi{color:var(--win)}.upct.mid{color:var(--gold)}.upct.lo{color:var(--lose)}
.uptier{font-size:14px;font-weight:500;color:var(--mute);margin-top:4px}
.upmul{margin-top:6px;font-weight:700;font-size:14px;color:var(--mute)}.upmul b{color:var(--text)}
.needle{position:absolute;inset:0;pointer-events:none;z-index:2}
.ugauge svg.ring2{transform-origin:50% 50%;transition:transform 2.5s cubic-bezier(.1,.62,.08,1);will-change:transform}
.needle::before{content:"";position:absolute;top:-5px;left:50%;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:22px solid var(--text);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.slide{width:100%;margin:12px 0 2px;-webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--s2);outline:none}
.slide::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#f2dcaa,#c9a064);border:3px solid var(--bg)}
.slide::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.up-chips button{min-width:48px;padding:10px 8px}

.picks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:15px 8px;text-align:center;font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.1}
.pick small{display:block;color:var(--mute);font-family:var(--ui);font-weight:500;font-size:13px;margin-top:3px}
.pick.sel{background:rgba(230,200,143,.1);border-color:var(--line2);color:var(--gold)}

.dock{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(14,15,21,.82);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--line2);border-radius:26px 26px 0 0}
.dock-bet{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.betbox{flex:1 1 36%;min-width:0;display:flex;align-items:center;gap:7px;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.betbox:focus-within{border-color:var(--line2)}.betbox .ic{font-size:18px}
.betbox input{width:100%;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font-family:var(--serif);font-size:26px;font-weight:700;padding:0}
.quick{display:flex;gap:6px}
.quick button{display:inline-flex;align-items:center;gap:4px;padding:12px 11px;border-radius:12px;border:1px solid var(--line);background:var(--s1);font-weight:700;font-size:13px;color:var(--mute)}
.quick button .ic{font-size:12px}.quick button.sel{color:var(--gold);border-color:var(--line2);background:rgba(230,200,143,.1)}

.pback{border:0;background:transparent;color:var(--mute);font-size:15px;font-weight:500;padding:2px 0 12px;display:flex;align-items:center;gap:6px}.pback .ic{font-size:14px;transform:rotate(180deg)}
.pass{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.pass .avatar{width:64px;height:64px;font-size:32px}
.pass .pn{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1}
.un{color:var(--mute);font-size:14px;margin-top:4px}
.bigbal{font-family:var(--serif);font-weight:700;font-size:56px;line-height:1;display:flex;align-items:center;gap:10px;margin:0 0 14px;padding:20px 18px;border-radius:24px;border:1px solid var(--line2);background:radial-gradient(90% 120% at 0% 0%,rgba(230,200,143,.16),transparent 65%),var(--s1)}
.bigbal .ic{font-size:34px}.bigbal small{font-family:var(--ui);font-size:13px;font-weight:500;color:var(--mute);margin-left:auto}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;border-radius:14px;font-weight:700;font-size:15px;border:1px solid var(--line2);background:transparent}
.pbtn.main{background:linear-gradient(180deg,#f2dcaa,#c9a064);border-color:transparent;color:var(--ink)}.pbtn .ic{font-size:17px}
.sec{font-family:var(--serif);font-size:24px;font-weight:700;margin:26px 2px 8px}
.lg{display:flex;align-items:baseline;gap:8px;padding:8px 2px;font-size:15px}
.lg span{color:var(--mute)}.lg i{flex:1;border-bottom:1px solid var(--line);transform:translateY(-3px);min-width:12px}
.lg b{font-weight:700;font-size:15px}.lg b .ic{font-size:13px}
.more{width:100%;border:0;background:transparent;color:var(--gold);font-weight:600;font-size:14px;padding:8px 0 0;text-align:left}
.empty{color:var(--mute);text-align:center;padding:26px;font-size:14px}
.gi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--s1);border:1px solid var(--line);flex:none}
.gi.promo{color:var(--gold)}.gi.dep{color:var(--win)}.gi.wd{color:var(--gold)}
.oplist{max-height:60vh;overflow-y:auto}
.op{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.op .t{flex:1;font-weight:600;font-size:14.5px}.op .t small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.op .r{font-weight:700;font-size:14px}.op .r.w{color:var(--win)}.op .r.l{color:var(--lose)}.op .r.n{color:var(--mute)}

.sheet-back{position:fixed;inset:0;z-index:60;background:rgba(5,5,8,.7);opacity:0;pointer-events:none;transition:opacity .2s}.sheet-back.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:61;left:50%;bottom:0;width:100%;max-width:440px;transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);border-radius:28px 28px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));background:#14151c;border-top:1px solid var(--line2);max-height:92vh;overflow-y:auto}
.sheet.on{transform:translate(-50%,0)}
.grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:2px auto 14px}
.sh-title{font-family:var(--serif);font-size:28px;font-weight:700;text-align:center;margin-bottom:14px}

.amt{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:10px 16px;margin-bottom:12px}
.amt:focus-within{border-color:var(--line2)}.amt .ic{font-size:24px}
.amt input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--text);font-family:var(--serif);font-size:34px;font-weight:700}
.amt .max{border:0;background:transparent;color:var(--gold);font-weight:700;font-size:13px;padding:6px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.grid4 button{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:13px 0;font-size:14px;font-weight:700;color:var(--mute)}
.grid4 button.sel{border-color:var(--line2);background:rgba(230,200,143,.1);color:var(--gold)}
.sh-icon{width:72px;height:72px;margin:4px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--s1);border:1px solid var(--line2);color:var(--gold)}

.sh-text{text-align:center;color:var(--mute);font-size:14.5px;line-height:1.55;margin-bottom:18px}.sh-text b{color:var(--text)}
.sh-note{text-align:center;color:var(--mute);font-size:13px;margin-top:12px}
.spin{width:48px;height:48px;border-radius:50%;border:3px solid var(--s2);border-top-color:var(--gold);animation:rot 1s linear infinite;margin:8px auto 16px}

.rows{margin-bottom:18px;background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:2px 16px}
.rows .r{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}.rows .r:last-child{border-bottom:0}
.rows .r span:first-child{color:var(--mute)}.rows .r span:last-child{font-weight:700;text-align:right;word-break:break-all}
.conf{position:absolute;top:45%;left:50%;width:7px;height:10px;border-radius:2px;pointer-events:none;opacity:0;z-index:9}
@keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-140%);z-index:80;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;background:#1d1e27;border:1px solid var(--line2);box-shadow:0 12px 30px rgba(0,0,0,.5);transition:transform .32s cubic-bezier(.2,.9,.3,1.2);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}.toast.err{border-color:rgba(229,112,122,.55);color:#f3b4ba}
.seg{grid-template-columns:repeat(2,1fr)}.seg button{gap:5px;font-size:13px;padding:11px 0}.seg button .ic{font-size:15px}
.online{margin-left:8px;color:var(--win)}.online i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--win);margin-right:4px;vertical-align:1px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.cs-up{margin:6px 0 11px;font-size:12px;color:var(--mute)}
.cs-card .cta{padding:11px;font-size:15px;pointer-events:none}
.cs-art{position:relative;height:108px;display:grid;place-items:center}
.cs-art::before{content:"";position:absolute;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,var(--g),transparent 68%)}
.cs-svg{position:relative;width:114px;animation:csBob 3.4s ease-in-out infinite}
@keyframes csBob{50%{transform:translateY(-5px) rotate(-1.5deg)}}
.sp{animation:csTw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes csTw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.15)}}
.cs-pr{display:flex;align-items:center;gap:12px;padding:9px 2px;border-bottom:1px solid var(--line)}
.cs-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:23px;background:var(--s2);border-bottom:3px solid var(--r,var(--mute));flex:none}
.cs-pr .n{flex:1;font-weight:600;font-size:14.5px}.cs-pr .n small{display:block;color:var(--mute);font-weight:500;font-size:12px;margin-top:2px}
.cs-pr .v{font-weight:700}
.cs-reel{position:relative;overflow:hidden;height:122px;border-radius:18px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px}
.cs-reel::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--gold);z-index:2;box-shadow:0 0 12px var(--gold)}
.cs-strip{display:flex;position:absolute;left:0;top:11px;will-change:transform}
.cs-cell{flex:none;width:96px;height:100px;margin:0 4px;border-radius:14px;background:var(--s2);border:1px solid var(--line);border-bottom:3px solid var(--r,var(--mute));display:grid;place-content:center;gap:2px;text-align:center;font-size:12px;font-weight:600}
.cs-cell i{font-style:normal;font-size:34px;line-height:1.1}.cs-cell span{color:var(--mute);font-weight:500}
.cs-win{text-align:center;margin:14px 0 6px;animation:csPop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes csPop{from{opacity:0;transform:scale(.7)}}
